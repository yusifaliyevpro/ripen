saveExact: true
engineStrict: true
ignoreWorkspaceRootCheck: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: "no-downgrade"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
packages:
  - "."
  - "docs"
minimumReleaseAgeExclude:
  - "@vitest/mocker@5.0.0"
  - "@vitest/spy@5.0.0"
  - vitest@5.0.0
  - rolldown-plugin-dts@0.28.5
  - tinyexec@1.3.1
  - tsdown@0.23.0
